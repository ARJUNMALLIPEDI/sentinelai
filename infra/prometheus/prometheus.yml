global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentinel-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  # Worker: tick timing plus the simulated fleet's gauges (sentinel_sim_*).
  - job_name: sentinel-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
